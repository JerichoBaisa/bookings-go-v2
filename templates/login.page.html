{{template "base" .}}

{{define "content"}}

{{$res := index .Data "login"}}
    <div class="container">
        <div class="row">
            <div class="col-6 offset-2">
                <h1 class="mt-4">Login Page</h1>
                <form action="/user/login" method="POST">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
                    <div class="form-group mt-3">
                        <label for="email">Email</label>
                        {{with .Form.Errors.Get "email"}}
                        <label class="text-danger">{{.}}</label>
                        {{end}}
                        <input type="text" name="email" id="email" class="form-control {{with .Form.Errors.Get "email"}} is-invalid {{end}}" placeholder=""
                            aria-describedby="emailHelp" value="" autocomplete="off">
                    </div>
    
                    <div class="form-group mt-3">
                        <label for="password">Password</label>
                        {{with .Form.Errors.Get "password"}}
                        <label class="text-danger">{{.}}</label>
                        {{end}}
                        <input type="password" name="password" id="password" class="form-control {{with .Form.Errors.Get "password"}} is-invalid {{end}}" placeholder=""
                            aria-describedby="passwordHelp" value=""  autocomplete="off">
                    </div>

                    <input type="submit" class="btn btn-primary mt-3" value="Login"/>
                </form>


            </div>
        </div>
    </div>

{{end}}
